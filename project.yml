# XcodeGen specification for Cio.
#
#   xcodegen generate          # (re)create Cio.xcodeproj
#   Scripts/fetch_cef.sh       # download the CEF distribution (once)
#   CONFIGURATION=Debug Scripts/build.sh
#
# The generated .xcodeproj is not committed; project.yml is the source of truth.
#
# CEF integration notes:
#   * The app does NOT link "Chromium Embedded Framework.framework" directly.
#     On macOS the framework is loaded at runtime from the app bundle by
#     CefScopedLibraryLoader, which is required by the Chromium sandbox and is
#     how the CEF binary distribution expects clients to start up.
#   * Only libcef_dll_wrapper.a (built by Scripts/build_cef_wrapper.sh) is linked.
#   * The bundle layout (framework + "Cio Helper*.app") is assembled by
#     Scripts/package_cef_runtime.sh after the app is linked and before Xcode
#     signs it.
name: Cio

options:
  bundleIdPrefix: com.example
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top
  deploymentTarget:
    macOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    CLANG_CXX_LANGUAGE_STANDARD: "c++20"
    CLANG_CXX_LIBRARY: "libc++"
    CLANG_ENABLE_OBJC_ARC: YES
    GCC_C_LANGUAGE_STANDARD: "gnu17"
    # The CEF wrapper build and the bundle packaging steps write outside the
    # target's build directory, so script sandboxing stays off.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # The checked-in CEF distribution and wrapper are arm64-only. Keep the
    # generated app/helper architecture aligned with that runtime; producing a
    # universal artifact requires a separate x86_64 CEF distribution.
    ARCHS: arm64
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_COMPILATION_MODE: incremental
      GCC_OPTIMIZATION_LEVEL: "0"
      GCC_PREPROCESSOR_DEFINITIONS:
        - "$(inherited)"
        - DEBUG=1
      DEBUG_INFORMATION_FORMAT: dwarf
      ONLY_ACTIVE_ARCH: YES
      ENABLE_HARDENED_RUNTIME: NO
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: YES
      STRIP_INSTALLED_PRODUCT: NO
      VALIDATE_PRODUCT: NO
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      GCC_OPTIMIZATION_LEVEL: "3"
      GCC_PREPROCESSOR_DEFINITIONS:
        - "$(inherited)"
        - NDEBUG=1
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ONLY_ACTIVE_ARCH: NO
      ENABLE_HARDENED_RUNTIME: YES
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      STRIP_INSTALLED_PRODUCT: YES
      COPY_PHASE_STRIP: YES
      VALIDATE_PRODUCT: YES

packages:
  CioModel:
    path: Packages/CioModel

  CioEngine:
    path: Packages/CioEngine

targets:
  Cio:
    type: application
    platform: macOS
    sources:
      - path: Cio
        excludes:
          - "Resources/Info.plist"
          - "Helper/**"
          # Developer documentation is not an application resource.
          - "Animation/*.md"
          # Unit tests are their own standalone target.
          - "Tests/**"
    settings:
      base:
        PRODUCT_NAME: Cio
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Cio
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Cio/Resources/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Cio/Bridge/Cio-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/ThirdParty/CEF"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/ThirdParty"
        OTHER_LDFLAGS:
          - "-lcef_dll_wrapper"
          - "-lsqlite3"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: Cio/Resources/Cio.entitlements
    scheme:
      configVariants: []
      # The scheme is committed as a template (SchemeTemplates/) because the
      # unit tests need a TestAction; XcodeGen's generated scheme
      # has none, and a build phase refreshes the copy after every generate.
    dependencies:
      # Build ordering only: the helper executable is copied into the
      # "Cio Helper*.app" bundles by Scripts/package_cef_runtime.sh,
      # so it must not be embedded into the app's Resources.
      - target: CioHelper
        embed: false
      - package: CioModel
      - package: CioEngine
    preBuildScripts:
      - name: "Build libcef_dll_wrapper"
        path: Scripts/build_cef_wrapper.sh
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: "Package CEF runtime (framework + helper applications)"
        path: Scripts/package_cef_runtime.sh
        basedOnDependencyAnalysis: false

  # Standalone logic/native-model tests; no TEST_HOST and no CEF launch.
  # The model is imported from the same local package used by the App.
  CioTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Cio/Tests
      - path: Cio/UI/Spotlight/SpotlightHoverGate.swift
      - path: Cio/UI/Spotlight/SpotlightInputState.swift
      - path: Cio/UI/Main/BrowserShellLayout.swift
      - path: Cio/Animation/AnimationValues.swift
      - path: Cio/Animation/BrowserAnimationPreferences.swift
      - path: Cio/Animation/GlassComponentAnimationValues.swift
      - path: Cio/Animation/GlassComponentLayoutMotion.swift
      - path: Cio/UI/Sidebar/SpaceTabPanelRow.swift
      - path: Cio/UI/Sidebar/SidebarTabPanelLayout.swift
      # The address-field editing rules and the log categories they use are also
      # dependency free, so the "one address field per session" guarantee is
      # tested here too.
      - path: Cio/UI/CommandBar/AddressAutocompleteModel.swift
      - path: Cio/UI/CommandBar/AddressCapsuleInteraction.swift
      - path: Cio/UI/CommandBar/AddressFieldModel.swift
    dependencies:
      - package: CioModel
      - package: CioEngine
    settings:
      base:
        PRODUCT_NAME: CioTests
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CioTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        OTHER_LDFLAGS:
          - "-lsqlite3"

  # Chromium sub-process entry point. The binary produced here is copied into
  # the "Cio Helper*.app" bundles by Scripts/package_cef_runtime.sh.
  CioHelper:
    type: tool
    platform: macOS
    sources:
      - path: Cio/Helper
    settings:
      base:
        PRODUCT_NAME: CioHelper
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/ThirdParty/CEF"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/ThirdParty"
        OTHER_LDFLAGS:
          - "-lcef_dll_wrapper"
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: Cio/Resources/Cio.entitlements
