# XcodeGen specification. Native Chromium is built separately by GN/Ninja.
# Build the app with CONFIGURATION=Debug Scripts/build.sh.
name: Cio

options:
  bundleIdPrefix: com.cerbur
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top
  deploymentTarget:
    macOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    CLANG_CXX_LANGUAGE_STANDARD: "c++20"
    CLANG_CXX_LIBRARY: "libc++"
    CLANG_ENABLE_OBJC_ARC: YES
    GCC_C_LANGUAGE_STANDARD: "gnu17"
    # Native engine packaging writes into the assembled app bundle.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # The pinned native engine build targets macOS arm64.
    ARCHS: arm64
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_COMPILATION_MODE: incremental
      GCC_OPTIMIZATION_LEVEL: "0"
      GCC_PREPROCESSOR_DEFINITIONS:
        - "$(inherited)"
        - DEBUG=1
      DEBUG_INFORMATION_FORMAT: dwarf
      ONLY_ACTIVE_ARCH: YES
      ENABLE_HARDENED_RUNTIME: NO
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: YES
      STRIP_INSTALLED_PRODUCT: NO
      VALIDATE_PRODUCT: NO
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      GCC_OPTIMIZATION_LEVEL: "3"
      GCC_PREPROCESSOR_DEFINITIONS:
        - "$(inherited)"
        - NDEBUG=1
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ONLY_ACTIVE_ARCH: NO
      ENABLE_HARDENED_RUNTIME: YES
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      STRIP_INSTALLED_PRODUCT: YES
      COPY_PHASE_STRIP: YES
      VALIDATE_PRODUCT: YES

packages:
  CioModel:
    path: Packages/CioModel

  CioEngine:
    path: Packages/CioEngine

  CioUI:
    path: Packages/CioUI

targets:
  Cio:
    type: application
    platform: macOS
    sources:
      - path: Cio
        excludes:
          - "Resources/Info.plist"
          # Unit tests are their own standalone target.
          - "Tests/**"
    settings:
      base:
        PRODUCT_NAME: Cio
        PRODUCT_BUNDLE_IDENTIFIER: com.cerbur.Cio
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Cio/Resources/Info.plist
        # Chromium retains its process runtime before SwiftUI starts. Use the
        # real app entry point instead of Xcode's preview trampoline/dylib.
        ENABLE_DEBUG_DYLIB: NO
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/build/ChromiumBuild/src/out/CioDev"
        OTHER_LDFLAGS:
          - "-lsqlite3"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Release:
          CODE_SIGN_ENTITLEMENTS: Cio/Resources/Cio.entitlements
    scheme:
      configVariants: []
      # The scheme is committed as a template (SchemeTemplates/) because the
      # unit tests need a TestAction; XcodeGen's generated scheme
      # has none, and a build phase refreshes the copy after every generate.
    dependencies:
      - target: CioChromium
        embed: true
      - package: CioModel
      - package: CioEngine
      - package: CioUI
    postBuildScripts:
      - name: "Package native Chromium runtime"
        path: Scripts/package_native_chromium.sh
        basedOnDependencyAnalysis: false

  # Swift sees only this stable interface; Chromium C++ is built by GN.
  CioChromium:
    type: framework
    platform: macOS
    sources:
      - path: Engine/CioChromium/Public
        headerVisibility: public
      - path: Engine/CioChromium/Shared
      - path: Engine/CioChromium/NativeLoader
        headerVisibility: private
    settings:
      base:
        PRODUCT_NAME: CioChromium
        PRODUCT_BUNDLE_IDENTIFIER: com.cerbur.Cio.Chromium
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Engine/CioChromium/Public"
          - "$(SRCROOT)/Engine/CioChromium/Native"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/build/ChromiumBuild/src/out/CioDev"
        OTHER_LDFLAGS:
          - "-Wl,-reexport_library,$(SRCROOT)/build/ChromiumBuild/src/out/CioDev/libchrome_dll.dylib"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@loader_path/../../../"
          - "@executable_path/../Frameworks"
    dependencies:
      - sdk: AppKit.framework
  # Standalone logic/native-model tests; no TEST_HOST and no browser launch.
  # The model is imported from the same local package used by the App.
  CioTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Cio/Tests
      # Native editing/layout tests import the same CioUI library as the App.
    dependencies:
      - package: CioModel
      - package: CioEngine
      - package: CioUI
    settings:
      base:
        PRODUCT_NAME: CioTests
        PRODUCT_BUNDLE_IDENTIFIER: com.cerbur.CioTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        OTHER_LDFLAGS:
          - "-lsqlite3"
